name: 목차 자동 생성

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 목차 만들기
        run: python3 build_index.py

      - name: 바뀐 목차 저장하기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "목차에 바뀐 내용이 없어요."
          else
            git commit -m "목차 자동 갱신"
            git push
          fi

      - name: 사이트 다시 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
